name: Ingestão de Notícias Gamer (Cron)

on:
  schedule:
    # Executa a cada 15 minutos (00, 15, 30, 45 de cada hora)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite disparo manual pelo painel do GitHub Actions
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cron-sync-news.yml'
      - 'scripts/sync-news.ts'
      - 'lib/services/game-enricher.ts'

# Evita execuções simultâneas concorrentes gravando no mesmo banco
concurrency:
  group: sync-gaming-news
  cancel-in-progress: false

jobs:
  sync-news:
    name: Sincronizar Feeds & Publicar com IA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js v22 com Cache NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências de Produção e Build
        run: npm ci

      - name: Executar Pipeline de Sincronização e Publicação
        run: npm run sync:news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          MAX_ITEMS_PER_FEED: 3
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
